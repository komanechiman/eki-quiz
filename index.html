<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="えきクイズ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EAF6FF">
<meta name="description" content="となりの駅から、あいだの駅を4択で当てる子ども向け駅クイズ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>えきの あいだは なーんだ?</title>
<style>
  :root{
    --bg:#EAF6FF; --card:#FFF; --text:#2B3A55; --soft:#6B7A99;
    --shadow:#D8E0EC; --sun:#FFC93C; --sun-dark:#C88A00; --track:#B9C6D9;
    --ok:#2BB673; --ng:#E5556E;
    --r-lg:24px; --r-md:18px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent;
     -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; }
  html,body{ height:100%; margin:0; }
  body{
    background:radial-gradient(circle at 15% 8%,#fff 0%,rgba(255,255,255,0) 42%),
               radial-gradient(circle at 88% 88%,#fff 0%,rgba(255,255,255,0) 38%),var(--bg);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","BIZ UDPGothic","Yu Gothic",sans-serif;
    color:var(--text); display:flex; flex-direction:column; align-items:center;
    padding:0 0 28px; -webkit-text-size-adjust:100%;
  }
  #app{ width:100%; max-width:460px; padding:0 16px; position:relative; }
  .rail-strip{ width:100%; height:14px; position:relative; overflow:hidden;
    background:linear-gradient(var(--track),var(--track)) center/100% 4px no-repeat; }
  .rail-strip::before{ content:""; position:absolute; top:0; right:0; bottom:0; left:0;
    background-image:repeating-linear-gradient(90deg,var(--track) 0 4px,rgba(0,0,0,0) 4px 16px);
    background-position:center; background-size:100% 14px; }
  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 2px 6px; gap:6px; }
  .brand{ display:flex; align-items:center; gap:7px; min-width:0; }
  .brand h1{ font-size:16px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top-btns{ display:flex; gap:7px; flex-shrink:0; }
  .icon-btn{ width:40px; height:40px; border-radius:50%; border:none; background:var(--card);
    box-shadow:0 3px 0 rgba(43,58,85,.14),0 2px 6px rgba(43,58,85,.10);
    display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; padding:0; }
  .icon-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(43,58,85,.14); }
  .panel{ display:none; background:var(--card); border-radius:var(--r-lg); padding:16px 18px 18px;
    box-shadow:0 5px 0 var(--shadow),0 8px 20px rgba(43,58,85,.12); margin-bottom:16px; }
  .panel.open{ display:block; }
  .panel h2{ font-size:15px; margin:0 0 6px; }
  .panel label{ display:block; font-size:12.5px; color:var(--soft); margin:12px 0 5px; }
  .panel select,.panel input[type=range]{ width:100%; }
  .panel select{ font-family:inherit; font-size:14px; padding:9px 10px; border-radius:12px;
    border:2px solid var(--shadow); background:#fff; color:var(--text); }
  .panel .test{ margin-top:14px; border:none; border-radius:999px; padding:11px 18px; font-family:inherit;
    font-size:14px; font-weight:700; background:var(--sun); color:#5c4000; cursor:pointer; box-shadow:0 3px 0 var(--sun-dark); }
  .panel .test:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--sun-dark); }
  .panel .note{ font-size:11.5px; color:var(--soft); margin-top:12px; line-height:1.6; }
  .screen{ display:none; }
  .screen.active{ display:block; -webkit-animation:fadeIn .25s ease; animation:fadeIn .25s ease; }
  @-webkit-keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .intro{ font-size:14px; color:var(--soft); margin:2px 4px 16px; line-height:1.65; }
  .cat{ margin-bottom:14px; }
  .cat-head{ display:flex; align-items:center; justify-content:space-between; width:100%;
    border:none; background:var(--card); border-radius:var(--r-md); padding:13px 16px;
    box-shadow:0 4px 0 var(--shadow); font-family:inherit; color:inherit; font-size:15px;
    font-weight:800; cursor:pointer; text-align:left; }
  .cat-head:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--shadow); }
  .cat-head .cnt{ font-size:12px; font-weight:400; color:var(--soft); }
  .cat-body{ display:none; padding-top:12px; }
  .cat.open .cat-body{ display:block; }
  .cat.open .cat-head .arw{ transform:rotate(90deg); }
  .arw{ display:inline-block; margin-left:8px; color:var(--soft); transition:transform .18s ease; }
  .line-card{ display:flex; align-items:center; gap:12px; width:100%; border:none; text-align:left;
    background:var(--card); border-radius:var(--r-md); padding:12px 14px; margin-bottom:10px;
    box-shadow:0 4px 0 var(--cs,var(--shadow)),0 4px 10px rgba(43,58,85,.07);
    cursor:pointer; font-family:inherit; color:inherit; }
  .line-card:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--cs,var(--shadow)); }
  .line-card .badge{ width:42px; height:42px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; }
  .line-card .meta{ flex:1; min-width:0; }
  .line-card .name{ font-size:15.5px; font-weight:700; margin-bottom:1px; }
  .line-card .desc{ font-size:11.5px; color:var(--soft); }
  .line-card .chev{ font-size:20px; color:var(--soft); }
  .quizbar{ display:flex; align-items:center; justify-content:space-between; margin:10px 0 10px; gap:8px; }
  .pill{ display:flex; align-items:center; gap:7px; background:var(--card); padding:8px 13px;
    border-radius:999px; box-shadow:0 3px 0 rgba(43,58,85,.10); font-weight:700; font-size:12.5px; max-width:60%; }
  .pill .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill .dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .pill.score{ font-size:14px; flex-shrink:0; }
  .progress{ display:flex; gap:5px; margin-bottom:12px; }
  .progress i{ flex:1; height:7px; border-radius:99px; background:var(--shadow); }
  .progress i.ok{ background:var(--ok); }
  .progress i.ng{ background:var(--ng); }
  .segcard{ background:var(--card); border-radius:var(--r-lg); padding:14px 10px 10px;
    box-shadow:0 5px 0 rgba(43,58,85,.08),0 6px 16px rgba(43,58,85,.08); margin-bottom:16px; }
  .segcard .prompt{ text-align:center; font-size:13px; color:var(--soft); margin-bottom:2px; }
  svg.segsvg{ display:block; width:100%; height:auto; }
  .replay-row{ display:flex; justify-content:center; margin-top:2px; }
  .speak-btn{ width:52px; height:52px; border-radius:50%; border:none; background:#80C241;
    color:#fff; font-size:22px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.16);
    display:flex; align-items:center; justify-content:center; padding:0; }
  .speak-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.16); }
  .choices{ display:grid; grid-template-columns:1fr 1fr; grid-gap:12px; gap:12px; }
  .choice{ background:var(--card); border:none; border-radius:var(--r-md); padding:15px 6px;
    box-shadow:0 4px 0 var(--shadow),0 4px 10px rgba(43,58,85,.06);
    cursor:pointer; text-align:center; font-family:inherit; color:inherit; min-height:66px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .choice:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
  .choice .ck{ font-size:16px; font-weight:800; line-height:1.25; }
  .choice .ch{ font-size:10.5px; color:var(--soft); margin-top:3px; }
  .choice.correct{ background:var(--sun); box-shadow:0 4px 0 var(--sun-dark); }
  .choice.correct .ch{ color:#7a5b00; }
  .choice.picked-wrong{ background:#FFE1E6; box-shadow:0 4px 0 #E5556E; }
  .choice.dim{ opacity:.4; }
  .burst{ position:absolute; font-size:20px; pointer-events:none; }
  .tip{ text-align:center; font-size:12.5px; color:var(--soft); margin-top:16px; }

  /* 大きな ◯ / ✕ */
  #verdict{ position:fixed; top:0; left:0; right:0; bottom:0; display:none;
    align-items:center; justify-content:center; z-index:99; pointer-events:none;
    background:rgba(255,255,255,.55); }
  #verdict.show{ display:flex; }
  #verdict .mark{ font-size:44vw; line-height:1; font-weight:900;
    -webkit-animation:pop .45s cubic-bezier(.2,1.5,.4,1); animation:pop .45s cubic-bezier(.2,1.5,.4,1); }
  #verdict.ok .mark{ color:var(--ok); }
  #verdict.ng .mark{ color:var(--ng); }
  #verdict .sub{ position:absolute; bottom:17%; left:0; right:0; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:1px; padding:0 16px; }
  #verdict .sub .lead{ font-size:15px; font-weight:700; opacity:.85; margin-bottom:4px; }
  #verdict .sub .kana{ font-size:14px; font-weight:700; opacity:.9; }
  #verdict .sub .kanji{ font-size:30px; font-weight:900; line-height:1.15;
    max-width:100%; overflow-wrap:anywhere; }
  #verdict.ok .sub{ color:var(--ok); }
  #verdict.ng .sub{ color:var(--ng); }
  @-webkit-keyframes pop{ 0%{transform:scale(.2); opacity:0;} 100%{transform:scale(1); opacity:1;} }
  @keyframes pop{ 0%{transform:scale(.2); opacity:0;} 60%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;} }

  /* 結果 */
  .done{ text-align:center; padding:20px 10px 10px; }
  .done .emoji{ font-size:50px; }
  .done h2{ font-size:22px; margin:8px 0 4px; }
  .done p.line{ color:var(--soft); margin:0 0 16px; font-size:14px; }
  .scorebox{ background:var(--card); border-radius:var(--r-lg); padding:20px 16px;
    box-shadow:0 5px 0 var(--shadow),0 6px 16px rgba(43,58,85,.08); margin-bottom:18px; }
  .scorebox .big{ font-size:15px; color:var(--soft); }
  .scorebox .big b{ font-size:46px; color:var(--text); font-weight:900; margin:0 4px; }
  .scorebox .pct{ font-size:13px; color:var(--soft); margin-top:4px; }
  .scorebox .stars{ font-size:22px; letter-spacing:3px; margin-top:10px; }
  .btn-row{ display:flex; flex-direction:column; gap:12px; }
  .btn{ border:none; border-radius:999px; padding:15px 20px; font-size:15.5px; font-weight:700;
    cursor:pointer; color:#fff; font-family:inherit; }
  .btn.primary{ background:#80C241; box-shadow:0 4px 0 #5E9A2C; }
  .btn.primary:active{ transform:translateY(3px); box-shadow:0 1px 0 #5E9A2C; }
  .btn.secondary{ background:#fff; color:var(--text); box-shadow:0 4px 0 var(--shadow); }
  .btn.secondary:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
  .btn.danger{ background:#fff; color:var(--ng); box-shadow:0 4px 0 var(--shadow); }

  /* 履歴 */
  .hist-sum{ display:flex; gap:10px; margin-bottom:16px; }
  .hist-sum div{ flex:1; background:var(--card); border-radius:var(--r-md); padding:12px 8px;
    text-align:center; box-shadow:0 4px 0 var(--shadow); }
  .hist-sum b{ display:block; font-size:22px; font-weight:900; }
  .hist-sum span{ font-size:11px; color:var(--soft); }
  .hrow{ display:flex; align-items:center; gap:11px; background:var(--card);
    border-radius:var(--r-md); padding:11px 14px; margin-bottom:9px; box-shadow:0 3px 0 var(--shadow); }
  .hrow .dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .hrow .info{ flex:1; min-width:0; }
  .hrow .ln{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hrow .dt{ font-size:11px; color:var(--soft); }
  .hrow .sc{ font-size:15px; font-weight:900; flex-shrink:0; }
  .hrow .sc small{ font-size:11px; font-weight:400; color:var(--soft); }
  .empty{ text-align:center; color:var(--soft); font-size:13.5px; padding:34px 10px; line-height:1.8; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; -webkit-animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="verdict"><span class="mark" id="verdictMark">◯</span><span class="sub" id="verdictSub"></span></div>
<div id="app">
  <div class="rail-strip"></div>
  <header class="topbar">
    <div class="brand"><span style="font-size:22px;">🚉</span><h1>えきの あいだは なーんだ?</h1></div>
    <div class="top-btns">
      <button class="icon-btn" id="histBtn" aria-label="きろく">🏆</button>
      <button class="icon-btn" id="gearBtn" aria-label="おとの せってい">⚙️</button>
      <button class="icon-btn" id="muteBtn" aria-label="おとを けす">🔊</button>
    </div>
  </header>
  <div class="panel" id="panel">
    <h2>おとの せってい</h2>
    <label for="voiceSel">よみあげる こえ</label>
    <select id="voiceSel"></select>
    <label for="rateRange">はなす はやさ　<span id="rateVal">1</span></label>
    <input type="range" id="rateRange" min="0.6" max="1.3" step="0.05" value="1">
    <button class="test" id="testBtn">こえを ためす</button>
    <p class="note">iPhone は「設定 &gt; アクセシビリティ &gt; 読み上げコンテンツ &gt; 声 &gt; 日本語」で Kyoko の「拡張」音声を入れると、ぐっと自然になります。</p>
  </div>

  <section class="screen active" id="screen-select">
    <p class="intro">ろせんを えらんでね。りょうどなりの えきが ヒント。まんなかの えきを 4つの なかから あててみよう!ぜんぶで 8もん だよ。</p>
    <div id="catList"></div>
  </section>

  <section class="screen" id="screen-quiz">
    <div class="quizbar">
      <div class="pill"><span class="dot" id="pillDot"></span><span class="nm" id="pillName"></span></div>
      <div class="pill score"><span id="qNo">1</span><span style="color:var(--soft);font-weight:400;">もんめ ・</span><span>⭐</span><span id="starCount">0</span></div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="segcard">
      <div class="prompt">この まんなかの えきは なーんだ?</div>
      <svg class="segsvg" id="segSvg" viewBox="0 0 320 112" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
      <div class="replay-row"><button class="speak-btn" id="speakBtn" aria-label="もういちど きく">🔊</button></div>
    </div>
    <div class="choices" id="choices"></div>
    <p class="tip">こたえの ボタンを タップしてね</p>
  </section>

  <section class="screen" id="screen-complete">
    <div class="done">
      <div class="emoji" id="doneEmoji">🎉</div>
      <h2 id="doneTitle">やったね!</h2>
      <p class="line" id="doneLine"></p>
      <div class="scorebox">
        <div class="big"><span id="doneTotal">8</span>もんちゅう<b id="doneScore">0</b>せいかい</div>
        <div class="pct" id="donePct"></div>
        <div class="stars" id="doneStars"></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="retryBtn">もういちど あそぶ</button>
        <button class="btn secondary" id="otherBtn">べつの ろせんに する</button>
        <button class="btn secondary" id="toHistBtn">きろくを みる</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-hist">
    <p class="intro">これまでの きろく</p>
    <div class="hist-sum">
      <div><b id="hsGames">0</b><span>あそんだ かいすう</span></div>
      <div><b id="hsCorrect">0</b><span>ぜんぶの せいかい</span></div>
      <div><b id="hsBest">-</b><span>さいこう きろく</span></div>
    </div>
    <div id="histList"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn primary" id="histBackBtn">もどる</button>
      <button class="btn danger" id="histClearBtn">きろくを ぜんぶ けす</button>
    </div>
  </section>
</div>
<script>
(function(){
"use strict";
/* 駅データ: "漢字|よみ" をカンマ区切り */
var CATS = [
  { cat:"新幹線", lines:[
    { n:"東北新幹線", c:"#00B04F", s:"東京|とうきょう,上野|うえの,大宮|おおみや,小山|おやま,宇都宮|うつのみや,那須塩原|なすしおばら,新白河|しんしらかわ,郡山|こおりやま,福島|ふくしま,白石蔵王|しろいしざおう,仙台|せんだい,古川|ふるかわ,くりこま高原|くりこまこうげん,一ノ関|いちのせき,水沢江刺|みずさわえさし,北上|きたかみ,新花巻|しんはなまき,盛岡|もりおか,いわて沼宮内|いわてぬまくない,二戸|にのへ,八戸|はちのへ,七戸十和田|しちのへとわだ,新青森|しんあおもり" },
    { n:"山形新幹線", c:"#F5A200", s:"東京|とうきょう,上野|うえの,大宮|おおみや,宇都宮|うつのみや,那須塩原|なすしおばら,郡山|こおりやま,福島|ふくしま,米沢|よねざわ,高畠|たかはた,赤湯|あかゆ,かみのやま温泉|かみのやまおんせん,山形|やまがた,天童|てんどう,さくらんぼ東根|さくらんぼひがしね,村山|むらやま,大石田|おおいしだ,新庄|しんじょう" },
    { n:"秋田新幹線", c:"#E5007F", s:"東京|とうきょう,上野|うえの,大宮|おおみや,仙台|せんだい,盛岡|もりおか,雫石|しずくいし,田沢湖|たざわこ,角館|かくのだて,大曲|おおまがり,秋田|あきた" },
    { n:"上越新幹線", c:"#4EA72E", s:"東京|とうきょう,上野|うえの,大宮|おおみや,熊谷|くまがや,本庄早稲田|ほんじょうわせだ,高崎|たかさき,上毛高原|じょうもうこうげん,越後湯沢|えちごゆざわ,浦佐|うらさ,長岡|ながおか,燕三条|つばめさんじょう,新潟|にいがた" },
    { n:"北陸新幹線", c:"#00A0DE", s:"東京|とうきょう,上野|うえの,大宮|おおみや,熊谷|くまがや,本庄早稲田|ほんじょうわせだ,高崎|たかさき,安中榛名|あんなかはるな,軽井沢|かるいざわ,佐久平|さくだいら,上田|うえだ,長野|ながの,飯山|いいやま,上越妙高|じょうえつみょうこう,糸魚川|いといがわ,黒部宇奈月温泉|くろべうなづきおんせん,富山|とやま,新高岡|しんたかおか,金沢|かなざわ,小松|こまつ,加賀温泉|かがおんせん,芦原温泉|あわらおんせん,福井|ふくい,越前たけふ|えちぜんたけふ,敦賀|つるが" },
    { n:"東海道新幹線", c:"#1B4EA0", s:"東京|とうきょう,品川|しながわ,新横浜|しんよこはま,小田原|おだわら,熱海|あたみ,三島|みしま,新富士|しんふじ,静岡|しずおか,掛川|かけがわ,浜松|はままつ,豊橋|とよはし,三河安城|みかわあんじょう,名古屋|なごや,岐阜羽島|ぎふはしま,米原|まいばら,京都|きょうと,新大阪|しんおおさか" }

/* ---- 保存（window.storage → localStorage → メモリ の順で使えるものを使う） ---- */
var HKEY = "eki-quiz:history";
var memStore = null;
function loadHistory(cb){
  if(window.storage && window.storage.get){
    try{
      window.storage.get(HKEY).then(function(r){
        var v = []; try{ v = r && r.value ? JSON.parse(r.value) : []; }catch(e){ v = []; }
        cb(v instanceof Array ? v : []);
      })["catch"](function(){ cb(lsGet()); });
      return;
    }catch(e){}
  }
  cb(lsGet());
}
function lsGet(){
  if(memStore) return memStore;
  try{ var s = window.localStorage.getItem(HKEY); return s ? (JSON.parse(s) || []) : []; }
  catch(e){ return memStore || []; }
}
function saveHistory(list, cb){
  memStore = list;
  var json = JSON.stringify(list);
  if(window.storage && window.storage.set){
    try{
      window.storage.set(HKEY, json).then(function(){ if(cb) cb(); })["catch"](function(){ lsSet(json); if(cb) cb(); });
      return;
    }catch(e){}
  }
  lsSet(json); if(cb) cb();
}
function lsSet(json){ try{ window.localStorage.setItem(HKEY, json); }catch(e){} }

/* ---- 音声（Safari/iOS 対応） ---- */
var hasTTS = ("speechSynthesis" in window) && (typeof SpeechSynthesisUtterance !== "undefined");
var voices = [], chosen = null, rate = 1.0, muted = false;
var sQ = [], sBusy = false, unlocked = false, guard = null, drainCbs = [];
function vScore(v){
  var n = (v.name||"").toLowerCase(), s = 0;
  if(/enhanced|premium|拡張|siri|neural/.test(n)) s += 60;
  if(/google/.test(n)) s += 45;
  if(/kyoko|o-?ren|otoya|hattori|nanami|ayumi|haruka|ichiro|keita|sayaka/.test(n)) s += 30;
  if(v.localService === false) s += 10;
  if(/compact|eloquence/.test(n)) s -= 40;
  return s;
}
function loadVoices(){
  if(!hasTTS) return;
  var all = window.speechSynthesis.getVoices() || [];
  var ja = all.filter(function(v){ return v.lang && v.lang.toLowerCase().replace("_","-").indexOf("ja") === 0; });
  if(!ja.length) return;
  ja.sort(function(a,b){ return vScore(b) - vScore(a); });
  voices = ja;
  if(!chosen || ja.indexOf(chosen) === -1) chosen = ja[0];
  fillVoices();
}
function fillVoices(){
  var sel = document.getElementById("voiceSel"); if(!sel) return;
  sel.innerHTML = "";
  if(!voices.length){
    var o = document.createElement("option");
    o.textContent = "日本語の こえが みつかりません";
    sel.appendChild(o); sel.disabled = true; return;
  }
  sel.disabled = false;
  voices.forEach(function(v,i){
    var o = document.createElement("option");
    o.value = String(i); o.textContent = v.name;
    if(v === chosen) o.selected = true;
    sel.appendChild(o);
  });
}
if(hasTTS){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  var tries = 0;
  var poll = setInterval(function(){ tries++; if(voices.length || tries > 24) clearInterval(poll); loadVoices(); }, 250);
}
function unlockSpeech(){
  if(unlocked || !hasTTS) return;
  try{ var u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.lang = "ja-JP";
       window.speechSynthesis.speak(u); unlocked = true; }catch(e){}
}
function say(t){ if(muted || !hasTTS || !t) return; sQ.push(t); pump(); }
function pump(){
  if(sBusy || !sQ.length) return;
  var text = sQ.shift(); sBusy = true;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; if(chosen) u.voice = chosen;
  u.rate = rate; u.pitch = 1.0; u.volume = 1.0;
  function fin(){
    if(guard){ clearTimeout(guard); guard = null; }
    if(!sBusy) return;
    sBusy = false;
    if(sQ.length){ setTimeout(pump, 90); } else { flushDrain(); }
  }
  u.onend = fin; u.onerror = fin;
  try{ window.speechSynthesis.speak(u); }catch(e){ fin(); return; }
  guard = setTimeout(fin, 1200 + text.length * 190);
}
function stopSpeech(){
  sQ = []; sBusy = false;
  if(guard){ clearTimeout(guard); guard = null; }
  if(hasTTS){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  flushDrain();
}
function flushDrain(){
  if(!drainCbs.length) return;
  var cbs = drainCbs; drainCbs = [];
  for(var i=0;i<cbs.length;i++){ try{ cbs[i](); }catch(e){} }
}
/* 読み上げが最後まで終わってから cb を呼ぶ（保険で maxWait 後には必ず呼ぶ） */
function whenSpeechDone(cb, maxWait){
  if(muted || !hasTTS || (!sBusy && !sQ.length)){ cb(); return; }
  var fired = false;
  function once(){ if(fired) return; fired = true; cb(); }
  drainCbs.push(once);
  setTimeout(once, maxWait || 9000);
}

/* ---- 効果音 ---- */
var actx = null;
function ensureAudio(){
  var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  if(!actx){ try{ actx = new AC(); }catch(e){ return; } }
  if(actx.state === "suspended") actx.resume();
}
function beep(fs, dur){
  if(muted) return; ensureAudio(); if(!actx) return;
  var t0 = actx.currentTime;
  fs.forEach(function(f,i){
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0+i*dur);
    g.gain.exponentialRampToValueAtTime(0.18, t0+i*dur+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+i*dur+dur*0.9);
    o.connect(g); g.connect(actx.destination);
    o.start(t0+i*dur); o.stop(t0+i*dur+dur);
  });
}
function sndOK(){ beep([523.25,659.25,783.99], 0.13); }
function sndNG(){ beep([330,247], 0.16); }

function shuffle(a){ a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a; }
function nb(i,d){
  var n = line.stations.length;
  if(line.loop) return (i+d+n)%n;
  var x = i+d; return (x>=0 && x<n) ? x : -1;
}

/* ---- クイズ ---- */
function start(L){
  line = L; score = 0; asked = 0; results = []; locked = false;
  document.getElementById("starCount").textContent = "0";
  document.getElementById("pillDot").style.background = L.color;
  document.getElementById("pillName").textContent = L.name;
  document.getElementById("speakBtn").style.background = L.color;
  var valid = [];
  for(var i=0;i<L.stations.length;i++){ if(nb(i,-1) !== -1 && nb(i,1) !== -1) valid.push(i); }
  queue = shuffle(valid).slice(0, QPR);
  total = queue.length;
  drawProgress();
  show("screen-quiz");
  next();
}
function drawProgress(){
  var p = document.getElementById("progress"); p.innerHTML = "";
  for(var i=0;i<total;i++){
    var b = document.createElement("i");
    if(results[i] === true) b.className = "ok";
    else if(results[i] === false) b.className = "ng";
    p.appendChild(b);
  }
}
function build(){
  var ti = queue[0], pi = nb(ti,-1), ni = nb(ti,1);
  var used = {}; used[ti]=1; used[pi]=1; used[ni]=1;
  var pool = [];
  for(var i=0;i<line.stations.length;i++){ if(!used[i]) pool.push(line.stations[i]); }
  var opts = shuffle([line.stations[ti]].concat(shuffle(pool).slice(0,3)));
  return { prev:line.stations[pi], next:line.stations[ni], target:line.stations[ti], options:opts };
}
function draw(prev, nxt){
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("segSvg");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  var y = 78, x1 = 44, xm = 160, x2 = 276;
  var tr = document.createElementNS(NS,"line");
  tr.setAttribute("x1",x1); tr.setAttribute("y1",y);
  tr.setAttribute("x2",x2); tr.setAttribute("y2",y);
  tr.setAttribute("stroke", line.color); tr.setAttribute("stroke-width","6");
  tr.setAttribute("stroke-dasharray","2 13"); tr.setAttribute("stroke-linecap","round");
  svg.appendChild(tr);
  function txt(x,ty,size,fill,weight,content){
    var t = document.createElementNS(NS,"text");
    t.setAttribute("x",x); t.setAttribute("y",ty);
    t.setAttribute("text-anchor","middle"); t.setAttribute("font-size",size);
    t.setAttribute("fill",fill); t.setAttribute("font-family","inherit");
    if(weight) t.setAttribute("font-weight",weight);
    t.textContent = content; return t;
  }
  function node(x, st, unknown){
    var g = document.createElementNS(NS,"g");
    var c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",x); c.setAttribute("cy",y);
    c.setAttribute("r", unknown ? 22 : 16);
    c.setAttribute("fill", unknown ? "#FFF3D0" : "#ffffff");
    c.setAttribute("stroke", unknown ? "#C88A00" : line.color);
    c.setAttribute("stroke-width", unknown ? 4 : 5);
    if(unknown) c.setAttribute("stroke-dasharray","6 5");
    g.appendChild(c);
    if(unknown){
      g.appendChild(txt(x, y+9, 26, "#C88A00", "800", "?"));
    }else{
      var kl = st.k.length, hl = st.h.length;
      var fk = kl >= 8 ? 9 : (kl >= 6 ? 10.5 : (kl >= 5 ? 12 : 14));
      var fh = hl >= 11 ? 7 : (hl >= 8 ? 8 : 9.5);
      g.appendChild(txt(x, 26, fh, "#6B7A99", null, st.h));
      g.appendChild(txt(x, 46, fk, "#2B3A55", "700", st.k));
    }
    svg.appendChild(g);
  }
  node(x1, prev, false); node(xm, null, true); node(x2, nxt, false);
}
function drawChoices(){
  var w = document.getElementById("choices"); w.innerHTML = "";
  q.options.forEach(function(o){
    var b = document.createElement("button");
    b.className = "choice";
    var fs = o.k.length >= 8 ? 12.5 : (o.k.length >= 6 ? 14 : 16);
    b.innerHTML = '<span class="ck" style="font-size:'+fs+'px">'+o.k+'</span><span class="ch">'+o.h+'</span>';
    b.setAttribute("data-k", o.k);
    b.addEventListener("click", function(){ tap(o,b); });
    w.appendChild(b);
  });
}
function next(){
  if(!queue.length){ finish(); return; }
  locked = false;
  q = build();
  document.getElementById("qNo").textContent = String(asked + 1);
  draw(q.prev, q.next); drawChoices(); askQuiet();
}
function ask(){
  stopSpeech();
  say(q.prev.h + "えきと、" + q.next.h + "えきの、あいだの えきは、なーんだ?");
}
function askQuiet(){
  say(q.prev.h + "えきと、" + q.next.h + "えきの、あいだの えきは、なーんだ?");
}

function showVerdict(ok, done){
  var v = document.getElementById("verdict");
  document.getElementById("verdictMark").textContent = ok ? "◯" : "✕";
  var sub = document.getElementById("verdictSub");
  if(ok){
    sub.innerHTML = '<span class="lead">せいかい!</span>'+
      '<span class="kana">'+q.target.h+'</span>'+
      '<span class="kanji">'+q.target.k+'</span>';
  }else{
    sub.innerHTML = '<span class="lead">こたえは…</span>'+
      '<span class="kana">'+q.target.h+'</span>'+
      '<span class="kanji">'+q.target.k+'</span>';
  }
  v.className = "show " + (ok ? "ok" : "ng");
  // ◯✕の最低表示時間と、読み上げ完了の両方を待ってから次へ
  var shown = false, spoken = false;
  function tryGo(){
    if(!(shown && spoken)) return;
    v.className = "";
    // 読み上げが終わってからも、答えを見る時間をすこし取る
    setTimeout(function(){ if(done) done(); }, ok ? 300 : 1000);
  }
  setTimeout(function(){ shown = true; tryGo(); }, ok ? 1400 : 3500);
  whenSpeechDone(function(){ spoken = true; tryGo(); });
}

function tap(o, btn){
  if(!q || locked) return;
  locked = true;
  ensureAudio(); unlockSpeech(); stopSpeech();
  var isOK = (o.k === q.target.k);
  var all = document.querySelectorAll(".choice");
  for(var i=0;i<all.length;i++){
    all[i].style.pointerEvents = "none";
    var k = all[i].getAttribute("data-k");
    if(k === q.target.k) all[i].className = "choice correct";
    else if(!isOK && all[i] === btn) all[i].className = "choice picked-wrong";
    else all[i].className = "choice dim";
  }
  results[asked] = isOK;
  asked++;
  if(isOK){
    score++;
    document.getElementById("starCount").textContent = String(score);
    sndOK(); burst(btn);
    say(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
  }else{
    sndNG();
    say("ざんねん。こたえは、" + q.target.h + "えき、だよ。");
  }
  drawProgress();
  showVerdict(isOK, function(){
    queue.shift(); next();
  });
}
function burst(btn){
  var app = document.getElementById("app");
  var r = btn.getBoundingClientRect(), pr = app.getBoundingClientRect();
  var cx = r.left - pr.left + r.width/2, cy = r.top - pr.top + r.height/2;
  var em = ["⭐","✨","🌟"];
  var canAnim = typeof Element !== "undefined" && Element.prototype && Element.prototype.animate;
  for(var i=0;i<7;i++){
    (function(){
      var el = document.createElement("div");
      el.className = "burst"; el.style.left = cx+"px"; el.style.top = cy+"px";
      el.textContent = em[Math.floor(Math.random()*em.length)];
      app.appendChild(el);
      var a = Math.random()*Math.PI*2, d = 38 + Math.random()*42;
      var dx = Math.cos(a)*d, dy = Math.sin(a)*d;
      if(canAnim){
        var an = el.animate([{transform:"translate(0px,0px) scale(0.6)",opacity:1},
                             {transform:"translate("+dx+"px,"+dy+"px) scale(1.2)",opacity:0}],
                            {duration:700+Math.random()*300, easing:"ease-out"});
        an.onfinish = function(){ if(el.parentNode) el.parentNode.removeChild(el); };
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 1200);
      }else{
        el.style.transition = "transform .8s ease-out, opacity .8s ease-out";
        setTimeout(function(){ el.style.transform = "translate("+dx+"px,"+dy+"px) scale(1.2)"; el.style.opacity = "0"; }, 16);
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 1000);
      }
    })();
  }
}

/* ---- 結果 ---- */
function starRating(sc, tot){
  var p = tot ? sc/tot : 0;
  if(p >= 1) return 5; if(p >= 0.85) return 4; if(p >= 0.6) return 3; if(p >= 0.35) return 2; if(p > 0) return 1;
  return 0;
}
function finish(){
  var pct = total ? Math.round(score/total*100) : 0;
  var rating = starRating(score, total);
  var emoji, title;
  if(pct === 100){ emoji = "🏆"; title = "パーフェクト!"; }
  else if(pct >= 75){ emoji = "🎉"; title = "よくできました!"; }
  else if(pct >= 50){ emoji = "😊"; title = "いい かんじ!"; }
  else { emoji = "🚂"; title = "つぎも がんばろう!"; }
  document.getElementById("doneEmoji").textContent = emoji;
  document.getElementById("doneTitle").textContent = title;
  document.getElementById("doneLine").textContent = line.name;
  document.getElementById("doneTotal").textContent = String(total);
  document.getElementById("doneScore").textContent = String(score);
  document.getElementById("donePct").textContent = "せいかいりつ " + pct + "%";
  var s = "";
  for(var i=0;i<5;i++) s += (i < rating ? "⭐" : "☆");
  document.getElementById("doneStars").textContent = s;
  stopSpeech();
  say(total + "もんちゅう、" + score + "もん せいかい!" + (pct === 100 ? "パーフェクト!すごいね!" : "よく がんばったね!"));

  var rec = { t: Date.now(), line: line.name, color: line.color, sc: score, tt: total };
  loadHistory(function(list){
    list.unshift(rec);
    if(list.length > 50) list = list.slice(0,50);
    saveHistory(list);
  });
  show("screen-complete");
}

/* ---- 履歴 ---- */
function fmt(ts){
  var d = new Date(ts);
  function p(n){ return (n<10?"0":"") + n; }
  return (d.getMonth()+1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function renderHistory(){
  loadHistory(function(list){
    var wrap = document.getElementById("histList");
    wrap.innerHTML = "";
    var games = list.length, corr = 0, best = null;
    list.forEach(function(r){
      corr += r.sc;
      var p = r.tt ? r.sc/r.tt : 0;
      if(best === null || p > best) best = p;
    });
    document.getElementById("hsGames").textContent = String(games);
    document.getElementById("hsCorrect").textContent = String(corr);
    document.getElementById("hsBest").textContent = (best === null) ? "-" : (Math.round(best*100) + "%");
    if(!games){
      wrap.innerHTML = '<p class="empty">まだ きろくが ないよ。<br>クイズを あそぶと ここに たまります!</p>';
      return;
    }
    list.forEach(function(r){
      var row = document.createElement("div");
      row.className = "hrow";
      var st = starRating(r.sc, r.tt), s = "";
      for(var i=0;i<st;i++) s += "⭐";
      row.innerHTML = '<span class="dot" style="background:'+(r.color||"#B9C6D9")+'"></span>'+
        '<span class="info"><span class="ln">'+r.line+'</span>'+
        '<span class="dt">'+fmt(r.t)+'　'+s+'</span></span>'+
        '<span class="sc">'+r.sc+'<small>/'+r.tt+'</small></span>';
      wrap.appendChild(row);
    });
  });
}

function show(id){
  var ss = document.querySelectorAll(".screen");
  for(var i=0;i<ss.length;i++) ss[i].className = "screen";
  document.getElementById(id).className = "screen active";
  window.scrollTo(0,0);
}

/* ---- UI ---- */
document.getElementById("gearBtn").addEventListener("click", function(){
  var p = document.getElementById("panel");
  p.className = (p.className.indexOf("open") === -1) ? "panel open" : "panel";
  loadVoices();
});
document.getElementById("histBtn").addEventListener("click", function(){
  stopSpeech(); renderHistory(); show("screen-hist");
});
document.getElementById("toHistBtn").addEventListener("click", function(){
  stopSpeech(); renderHistory(); show("screen-hist");
});
document.getElementById("histBackBtn").addEventListener("click", function(){ show("screen-select"); });
document.getElementById("histClearBtn").addEventListener("click", function(){
  if(window.confirm("これまでの きろくを ぜんぶ けしますか?")){
    saveHistory([], function(){ renderHistory(); });
  }
});
document.getElementById("voiceSel").addEventListener("change", function(e){
  var i = parseInt(e.target.value,10); if(!isNaN(i) && voices[i]) chosen = voices[i];
});
document.getElementById("rateRange").addEventListener("input", function(e){
  rate = parseFloat(e.target.value);
  document.getElementById("rateVal").textContent = String(rate);
});
document.getElementById("testBtn").addEventListener("click", function(){
  unlockSpeech(); stopSpeech();
  say("とうきょうえきと、しんばしえきの、あいだの えきは、なーんだ?");
});
document.getElementById("muteBtn").addEventListener("click", function(e){
  muted = !muted;
  e.currentTarget.textContent = muted ? "🔇" : "🔊";
  if(muted) stopSpeech(); else unlockSpeech();
});
document.getElementById("speakBtn").addEventListener("click", function(){ ensureAudio(); unlockSpeech(); ask(); });
document.getElementById("retryBtn").addEventListener("click", function(){ stopSpeech(); start(line); });
document.getElementById("otherBtn").addEventListener("click", function(){ stopSpeech(); show("screen-select"); });
document.addEventListener("touchstart", function once(){ ensureAudio(); unlockSpeech();
  document.removeEventListener("touchstart", once); }, false);

renderCats();
})();
</script>
<script>
/* ---- Service Worker 登録（オフライン動作 + 自動更新） ---- */
(function(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      // 新しいバージョンが見つかったら知らせる
      reg.addEventListener("updatefound", function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", function(){
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            showUpdateBar();
          }
        });
      });
      // 起動のたびに更新をチェック
      try{ reg.update(); }catch(e){}
    })["catch"](function(){ /* 失敗してもアプリは普通に動く */ });

    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloading) return; reloading = true; window.location.reload();
    });
  });

  function showUpdateBar(){
    if(document.getElementById("updBar")) return;
    var bar = document.createElement("div");
    bar.id = "updBar";
    bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:200;"+
      "background:#2B3A55;color:#fff;border-radius:16px;padding:13px 16px;display:flex;"+
      "align-items:center;gap:12px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);"+
      "font-family:inherit;";
    bar.innerHTML = '<span style="flex:1">あたらしい バージョンが あります</span>'+
      '<button id="updBtn" style="border:none;border-radius:999px;padding:9px 16px;'+
      'background:#FFC93C;color:#5c4000;font-weight:800;font-size:13px;font-family:inherit;'+
      'cursor:pointer;">こうしん</button>';
    document.body.appendChild(bar);
    document.getElementById("updBtn").addEventListener("click", function(){
      navigator.serviceWorker.getRegistration().then(function(reg){
        if(reg && reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
        else window.location.reload();
      });
    });
  }
})();
</script>
